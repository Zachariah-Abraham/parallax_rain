name: parallax_rain
description: Use this package to create cool 3D rain effects. Customize with multiple colors, different raindrop speeds, drop trail effects and more!
version: 1.4.0
homepage: https://github.com/Zachariah-Abraham/parallax_rain
repository: https://github.com/Zachariah-Abraham/parallax_rain
issue_tracker: https://github.com/Zachariah-Abraham/parallax_rain/issues
topics:
  - rain
  - animation
  - parallax
  - effects
  - ui

screenshots:
  - description: Multicolor and blue-grey rain, with and without drop trails
    path: doc/screenshots/rain.png
  - description: Animated parallax rain in the example app
    path: doc/screenshots/rain.webp

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter
